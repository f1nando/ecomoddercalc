server {
    listen 80;
    listen [::]:80;
    server_name ecomoddercalc.demotest.live;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ecomoddercalc/acme;
        try_files $uri =404;
    }
    location / { return 301 https://ecomoddercalc.demotest.live$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ecomoddercalc.demotest.live;
    ssl_certificate /etc/letsencrypt/live/ecomoddercalc.demotest.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecomoddercalc.demotest.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/ecomoddercalc/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
