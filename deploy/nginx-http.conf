server {
    listen 80;
    listen [::]:80;
    server_name ecomoddercalc.demotest.live;
    root /var/www/ecomoddercalc/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ecomoddercalc/acme;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
